# -- Person intel WebSocket: Go only (404 for a client in the Python bucket), upgrade headers, token-safe logging --
# The Python handler behind this path has no deadline, no concurrency caps and echoes str(exc), and no frontend code uses
# it, so it must never be reachable on Python: only the Go bucket is proxied (go-split.conf `go` line); at 0% it is 404.
location = /ws/person/enrich {
        if ($go_bucket != go) { return 404; }
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Upstream $go_bucket always;
        proxy_pass http://$auth_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # `?token=` is a bearer access token: log without the query string and keep nginx error-log
        # lines (which print the full request line) at `crit` only. Treat the global error_log as sensitive.
        access_log /dev/stdout sse_noquery;
        error_log /dev/stderr crit;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
}
