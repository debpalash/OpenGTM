# Go-served routes (plan 02). Included inside the `server` block of default.conf;
# the split_clients/map half lives in go-split.conf (http level).
# Only these paths are eligible for Go. Everything else, including /auth/sso/*, stays on api_backend.
# /admin/ and /scim/ are deliberately NOT exposed (user decision; unchanged from Python today).
# add_header inside a location replaces server-level headers, so the security headers are repeated.
# proxy_pass with a variable and no URI part forwards the original request URI unchanged.

location = /auth/token {
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Upstream $go_bucket always;
        proxy_pass http://$auth_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
}

