# POST /api/watches/{id}/poll: the enqueue they perform is routed by the executor flags (GO_EXECUTOR_TRIGGER_EVAL,
# GO_EXECUTOR_WATCH_POLL), not by the path, so the bucket only decides which API process validates and enqueues.
# `/api/automations/` is a regex (Python serves only /triggers... and /runs/...; an unknown subpath is 404 on both
# stacks). `/api/watches` is a regex so `/api/watchesx` stays on api_backend. The Go automation routes register only
# when GO_AUTOMATION_ROUTES_ENABLED=true and AUTOMATIONS_ALLOW_LEGACY_OUTREACH=false. The watch routes need
# GO_AUTOMATION_ROUTES_ENABLED=true and PG_LEAD_STORE=true (they do not check the legacy-outreach flag). With a
# flag missing Go answers 404, so nginx must keep the matching locations on Python (canary 0%) until the flags match. See docs/go-port/runbooks/automations-cutover.md.

