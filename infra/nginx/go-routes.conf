# ===== BEGIN plan 04: workbook CRUD (grouped; plan 05 owns its own block elsewhere) =====
# Regex locations are tried in file order and the first match wins (they ignore prefix length), so the
# retained-on-Python block MUST stay above the Go block. Retained routes always go to api_backend, at every
# canary percentage; they have no X-Upstream header. scripts/nginx-routing-check.sh asserts both.
# See docs/go-port/runbooks/workbook-crud-cutover.md.

