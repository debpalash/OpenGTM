# -- Audiences: client bucket; create, patch and refresh sticky per workspace --
location = /api/audiences {
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        set $aud_up $auth_upstream;
        set $aud_hdr $go_bucket;
        if ($request_method ~ ^(POST)$) {
                set $aud_up $ws_upstream;
                set $aud_hdr $go_ws_bucket;
        }
        add_header X-Upstream $aud_hdr always;
        proxy_pass http://$aud_up;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
