# 7 copilotkit + 5 person intel routes, all ported, none retained (testdata/contract/retained_copilot_routes.txt).
# Exact (=) and anchored regex locations only, so an unknown sibling (/api/copilotkit/other, /api/personx), a
# trailing-slash variant (FastAPI redirect_slashes answers it, Go would 404) and anything not listed stay on
# api_backend at every percentage. /api/copilotkit* is sticky per WORKSPACE (X-Workspace-Id, falling back to the
# client key: $go_ws_bucket, the second knob in go-split.conf, keep both percentages equal), so one conversation
# is never served half by each stack mid-turn (both stacks read the same tables, so a split would be safe but
# confusing). /api/person/* and /ws/person/enrich follow the client bucket. Go registers all of them only when
# COPILOT_GO_ENABLED=true and PG_LEAD_STORE=true (chat also needs PY_WORKER_URL/PY_WORKER_TOKEN); with a flag
# missing Go answers 404, so keep the canary at 0% until the flags match. NOTE: /ws/person/enrich had no
# location before (it fell through to the SPA); it is now proxied to api_backend at 0%.
# See docs/go-port/runbooks/copilot-cutover.md.

# -- Chat (POST /api/copilotkit): SSE, workspace bucket --
location = /api/copilotkit {
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Upstream $go_ws_bucket always;
        proxy_pass http://$ws_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Chat SSE (POST): no response buffering (the backend's `X-Accel-Buffering: no` is honoured, we never
        # ignore it), one hour read timeout for long tool turns (the Go turn deadline, COPILOT_TURN_TIMEOUT_SECONDS,
        # is 15 min), HTTP/1.1 upstream. `proxy_request_buffering` is deliberately NOT set: the body is small and Go
        # bounds it (413 above COPILOT_MAX_BODY_BYTES).
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 300s;
}

