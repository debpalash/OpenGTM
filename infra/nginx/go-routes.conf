# ===== BEGIN plan 06: enrichment jobs (run, cell run, sources, refresh, migrate, WebSocket, ingest) =====
# 14 routes ported, 3 retained (testdata/contract/retained_enrichment_routes.txt). Regex locations are tried in file
# order and the first match wins, so the retained block comes first, then the per-route Go splits, and all of it must
# stay above plan 04's `~ ^/api/workbooks(/|$)`. Retained routes (and every trailing-slash variant, which FastAPI
# answers with redirect_slashes and Go would 404) always go to api_backend and carry no X-Upstream header.
# `POST /run` and cell run are keyed per WORKSPACE (X-Workspace-Id, falling back to the client key when the header is
# absent; see $go_ws_bucket in go-split.conf), so a workspace is never served half by each stack while the
# GO_EXECUTOR_* cohort decides the executor. The WebSocket follows the client bucket. Go registers these only
# when PG_LEAD_STORE=true and GO_RUN_ROUTES_ENABLED=true (ingest also INGEST_API_ENABLED); with the flags off Go
# answers 404, so raise the canary only after they are on. See docs/go-port/runbooks/enrichment-jobs-cutover.md.

# -- Retained on FastAPI: generate-column (LLM, D2), meta/provider-accuracy (D3), sources/{col}/preview (D6) --
location ~ ^/api/workbooks/(meta/provider-accuracy|[^/]+/sources/[^/]+/preview)$ {
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Same proxy settings as `location /api/` in default.conf (WebSocket, long timeouts, SSE).
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
}

# generate-column; also trailing-slash variants of every ported enrichment route (Go registers none)
location ~ ^/api/v2/workbooks/[^/]+/(generate-column/?|ingest-token/|rows/ingest/)$ {
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Same proxy settings as `location /api/` in default.conf (WebSocket, long timeouts, SSE).
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
}

# trailing-slash variant of the WebSocket route: retained on Python (api_backend), token-safe logging
location ~ ^/api/workbooks/[^/]+/ws/$ {
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
        # `?token=` is a bearer access token: log without the query string, error_log at `crit` only.
        access_log /dev/stdout sse_noquery;
        error_log /dev/stderr crit;
}

# trailing-slash variants of the ported v1 enrichment routes
location ~ ^/api/workbooks/(meta/provider-(stats|accuracy)|[^/]+/(run(/estimate)?|stop|sources(/[^/]+(/run|/preview))?|refresh(-policy)?|migrate)|[^/]+/rows/[^/]+/cells/[^/]+/run)/$ {
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Same proxy settings as `location /api/` in default.conf (WebSocket, long timeouts, SSE).
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
}

# -- Ported, sticky per workspace: POST /run and cell run --
location ~ ^/api/workbooks/[^/]+/(run|rows/[^/]+/cells/[^/]+/run)$ {
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Upstream $go_ws_bucket always;
        proxy_pass http://$ws_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Same proxy settings as `location /api/` in default.conf (WebSocket, long timeouts, SSE).
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
}

# -- Ported, client bucket: WebSocket (upgrade headers, 1h read timeout) --
location ~ ^/api/workbooks/[^/]+/ws$ {
        # `?token=` is a bearer access token: log without the query string and keep nginx error-log
        # lines (which print the full request line) at `crit` only. Treat the global error_log as sensitive.
        access_log /dev/stdout sse_noquery;
        error_log /dev/stderr crit;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Upstream $go_bucket always;
        proxy_pass http://$auth_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Same proxy settings as `location /api/` in default.conf (WebSocket, long timeouts, SSE).
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
}

# -- Ported, client bucket: estimate, stop, provider-stats, sources, refresh, refresh-policy, migrate, ingest --
location ~ ^/api/workbooks/(meta/provider-stats|[^/]+/(run/estimate|stop|sources(/[^/]+/run)?|refresh(-policy)?|migrate))$ {
