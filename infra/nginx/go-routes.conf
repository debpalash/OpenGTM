# SSE progress stream; both stacks read the same Redis channel, so no stickiness is needed
location = /api/events {
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Upstream $go_bucket always;
        proxy_pass http://$auth_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE (Task 16): no buffering, long idle read (heartbeat every 15 s), no `Connection: upgrade`.
        # `?token=` is a bearer access token: this location logs with `sse_noquery` ($uri, no query string).
        access_log /dev/stdout sse_noquery;
        # nginx error-log lines (upstream reset/timeout/refused) print the full request line including
        # `?token=`, and the format cannot be changed. Those lines are level `error`, so log only
        # `crit` and above for this location. Treat the global error_log as sensitive regardless.
        error_log /dev/stderr crit;
        limit_conn sse_per_ip 20;
        limit_conn_status 429;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 300s;
        add_header X-Accel-Buffering no always;
}

