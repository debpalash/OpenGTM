# BEGIN audiences-destinations
# Plan 10: audiences and destinations.
# 23 of the 25 routes of routers/audiences.py and routers/destinations.py are ported; GET /api/audiences/capabilities and
# GET /api/audience-destinations/types (certification catalogs, D1) are retained on Python
# (testdata/contract/retained_audience_routes.txt) and always go to api_backend: they come FIRST, as exact locations.
# Exact (=) and anchored regex locations only, so an unknown sibling, a trailing-slash variant (FastAPI redirect_slashes
# answers it, Go would 404) and anything not listed stay on api_backend at every percentage; nothing here is served by a new
# path that Python did not already serve through `location /api/`. The ported routes follow the canary bucket ($go_bucket),
# except that POST /api/audiences, PATCH /api/audiences/{id} and POST /api/audiences/{id}/refresh are sticky per WORKSPACE
# ($go_ws_bucket via $ws_upstream, the second knob in go-split.conf: keep both percentages equal), so a refresh, its
# membership events and its destination-sync enqueue never split across stacks during the canary. `if` below only wraps
# `set` (the safe use). The public CRM callback POST /api/audience-destinations/inbound/{id} follows the client bucket (the
# caller has no X-Workspace-Id; its key is the client address, so one source reaches one stack), forwards X-Real-IP and
# X-Forwarded-For so Go's per-IP limiter sees the client, and is Python at 0% exactly as before. Go registers the audience
# routes only with GO_AUDIENCE_ROUTES_ENABLED + PG_LEAD_STORE + the plan 08 event emitter, the destination routes with
# GO_DEST_ROUTES_ENABLED + PG_LEAD_STORE; with a flag off Go answers 404, so keep the canary at 0% until the startup log has
# no "routes not registered" line. Job executors are moved by the worker flags, not here.
# See docs/go-port/runbooks/audiences-destinations-cutover.md.

