# enrichment/LLM/Redis routes + WebSocket (plan 05)
location ~ ^/api/workbooks/(meta/provider-(stats|accuracy)|[^/]+/(run(/estimate)?|stop|sources(/.*)?|refresh(-policy)?|migrate|ws)|[^/]+/rows/[^/]+/cells/[^/]+/run)/?$ {
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
