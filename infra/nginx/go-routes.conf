# (testdata/contract/retained_outreach_routes.txt) and always goes to api_backend: it comes FIRST, as an exact location.
# Exact (=) and anchored regex locations only, so an unknown sibling (/api/outreach/other), a trailing-slash variant
# (FastAPI redirect_slashes answers it, Go would 404) and anything not listed stay on api_backend at every percentage;
# nothing here is served by a new path that Python did not already serve through `location /api/`. The ported routes
# follow the canary bucket ($go_bucket). /api/outreach/unsubscribe (GET landing + POST one-click) and
# /api/outreach/webhooks/bounce are public (no login) and use the same $go_bucket key, which for a caller without an
# Authorization header is its client address: one request source always reaches one stack, so each stack's in-process
# limiter sees all of that source's requests. They forward X-Real-IP and X-Forwarded-For so the public limiter sees the
# client, not nginx (Go honours X-Real-IP only from TRUST_PROXY_CIDRS). Unsubscribe links already sent keep resolving
# at every percentage: tokens are verified with the same derived key on both stacks (SECRETS_MASTER_KEY identical).
# Go registers these routes only when GO_OUTREACH_ROUTES_ENABLED=true and PG_LEAD_STORE=true; with a flag off Go answers
# 404, so keep the canary at 0% until the flags match. Sends and inbound polls are moved by the worker flags, not here.
# See docs/go-port/runbooks/outreach-cutover.md.

# -- Retained on Python (always api_backend, first) --
location = /api/campaigns/generate {
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Upstream py always;
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Same proxy settings as `location /api/` in default.conf (WebSocket, long timeouts, SSE).
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
}

