# http-level half of the Go API canary (included from default.conf, outside `server`).
# Operator knob: the single `go` line. Shipped COMMENTED OUT = 0% (all Python); nginx rejects a
# literal `0%`, so rollback means commenting the line out again. Ramp 5% -> 25% -> 100%, then
#   docker compose exec nginx nginx -t && docker compose exec nginx nginx -s reload
# Sticky per client ADDRESS only. The key is never client-chosen (no Authorization/cookie/header input): a caller
# cannot steer itself onto the weaker stack or split guesses across the two in-process limiters. $remote_addr is the
# TCP peer; behind another trusted proxy/LB, restore the real client address first (realip module) or every client
# shares one bucket. /api/outreach/unsubscribe, /api/outreach/webhooks/bounce and /auth/setup* /auth/sso/* are pinned
# to Go in go-routes.conf and ignore this split; /auth/token and /auth/refresh DO follow it (move them to 100% first).
split_clients "${remote_addr}" $go_bucket {
    # 5%  go;   # CANARY: uncomment and set the percentage (5, 25, 100)
    *    py;
}

map $go_bucket $auth_upstream {
    go       api_go;
    default  api_backend;
}

# Plan 06: POST /api/workbooks/{id}/run and cell run are sticky per WORKSPACE (X-Workspace-Id header; falls back to
# the client address when absent), so a workspace's runs are never split across stacks during the canary and the
# GO_EXECUTOR_* cohort alone decides the executor. SECOND KNOB: keep this percentage equal to the one above
# (the same sed in scripts/nginx-routing-check.sh sets both).
map $http_x_workspace_id $go_ws_key {
    default  $http_x_workspace_id;
    ""       $remote_addr;
}

split_clients "${go_ws_key}" $go_ws_bucket {
    # 5%  go;   # CANARY (plan 06 run routes): same percentage as above
    *    py;
}

map $go_ws_bucket $ws_upstream {
    go       api_go;
    default  api_backend;
}

# Access log format for /api/events (plan 05): `$uri` instead of `$request`, so the `?token=` access token
# in the query string never reaches the log.
log_format sse_noquery '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                       '$status $body_bytes_sent "$http_referer" "$http_user_agent" upstream=$go_bucket';

# Per-client-address cap on concurrent /api/events streams (plan 05 final fix): one client cannot
# hold every SSE slot. The Go API also caps streams per user and per workspace (429).
limit_conn_zone $binary_remote_addr zone=sse_per_ip:10m;
