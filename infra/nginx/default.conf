# ──────────────────────────────────────────────────────────────────
# Nginx reverse proxy for OpenGTM. Everything goes to the Go API (api-go): the embedded React UI, /api, /auth
# and the WebSocket/SSE streams. The Python API, its canary split (go-split.conf) and the per-route Go/Python
# table (go-routes.conf) are gone (plan 15). Only locations that need different proxy settings or token-safe
# logging are listed; everything else falls into `/api/`, `/auth/` or `/`.
# Check: scripts/nginx-routing-check.sh
# ──────────────────────────────────────────────────────────────────

# Docker replaces a service container (and therefore its bridge IP) on deploy.
# Re-resolve through Docker's embedded DNS so a long-lived nginx process never
# pins a dead API address after `docker compose up`.
resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 5s;

upstream api_go {
    zone api_go 64k;
    server api-go:8000 resolve;
}

# Access log format for locations whose query string carries a credential (`?token=` on SSE/WebSocket, the SSO
# callback `?code=`): `$uri` instead of `$request`, so the secret never reaches the log.
log_format sse_noquery '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                       '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

# Per-client-address cap on concurrent /api/events streams: one client cannot hold every SSE slot. The Go API
# also caps streams per user and per workspace (429).
limit_conn_zone $binary_remote_addr zone=sse_per_ip:10m;

# `Connection: upgrade` only when the client asked for an upgrade (WebSocket); otherwise an empty Connection
# header, which keeps SSE and plain requests on HTTP/1.1 without forcing `upgrade`.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      "";
}

server {
    listen 80;
    server_name _;

    # Security headers. A location with its own add_header replaces these, so such locations repeat them.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Set once here: a location that sets any proxy_set_header would lose all of the above.
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Service-to-service API: lead_net only, never through the proxy.
    location /internal/ {
        return 404;
    }

    # Person intel WebSocket (auth-gated in Go). Exact match, so it beats the /ws regex below.
    # `?token=` is a bearer access token: log without the query string and keep error-log lines (which print the
    # full request line) at `crit` only. Treat the global error_log as sensitive.
    location = /ws/person/enrich {
        proxy_pass http://api_go;
        access_log /dev/stdout sse_noquery;
        error_log /dev/stderr crit;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    # /admin and /scim are not exposed (user decision); other /ws paths do not exist.
    location ~ ^/(admin|scim|ws)(/|$) {
        return 404;
    }

    # SSE progress stream: no buffering, long idle read (heartbeat every 15 s), no `Connection: upgrade`,
    # per-address stream cap (Connection is empty: the map above), token-safe logging.
    location = /api/events {
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Accel-Buffering no always;
        proxy_pass http://api_go;
        access_log /dev/stdout sse_noquery;
        error_log /dev/stderr crit;
        limit_conn sse_per_ip 20;
        limit_conn_status 429;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 300s;
    }

    # Workbook WebSocket (with and without the trailing slash): upgrade headers, 1h read, token-safe logging.
    location ~ ^/api/workbooks/[^/]+/ws/?$ {
        proxy_pass http://api_go;
        access_log /dev/stdout sse_noquery;
        error_log /dev/stderr crit;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    # Copilot chat (POST, SSE): no response buffering, one hour read for long tool turns (the Go turn deadline,
    # COPILOT_TURN_TIMEOUT_SECONDS, is 15 min). The request body is small and bounded by Go.
    location = /api/copilotkit {
        proxy_pass http://api_go;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 300s;
    }

    # ── API routes (REST, WebSocket, SSE) ──
    location /api/ {
        proxy_pass http://api_go;

        # WebSocket support

        # Long-running enrichments and CSV export streams
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Disable buffering for SSE/streaming (workbook updates, exports)
        proxy_buffering off;
    }

    # Workspace SSO login: the callback query carries the one-time authorization code, so log the path only.
    location ^~ /auth/sso/ {
        proxy_pass http://api_go;
        access_log /dev/stdout sse_noquery;
    }

    # Authentication routes are mounted at /auth rather than /api/auth.
    location /auth/ {
        proxy_pass http://api_go;
    }

    location = /health {
        proxy_pass http://api_go;
    }

    # ── Web UI (React SPA), embedded in the Go API (apps/backend-go/internal/webui) ──
    # api-go serves index.html, hashed /assets/* (immutable cache) and the SPA fallback. The Go handler repeats
    # the security headers, so hide its copies: the server-level add_header values apply once.
    location / {
        proxy_pass http://api_go;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
}
