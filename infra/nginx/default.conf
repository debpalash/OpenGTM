# ──────────────────────────────────────────────────────────────────
# Nginx reverse proxy for Lead Data
# Routes: / → api-go (embedded React UI), /api → FastAPI (+ ported Go routes), WebSocket upgrade
# ──────────────────────────────────────────────────────────────────

# Docker replaces a service container (and therefore its bridge IP) on deploy.
# Re-resolve through Docker's embedded DNS so a long-lived nginx process never
# pins a dead API address after `docker compose up`.
resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 5s;

upstream api_backend {
    zone api_backend 64k;
    server api:8000 resolve;
}

upstream api_go {
    zone api_go 64k;
    server api-go:8000 resolve;
}

# Go API canary: split_clients/map ($go_bucket, $auth_upstream). Percentage is edited there.
include /etc/nginx/go-split.conf;

server {
    listen 80;
    server_name _;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Service-to-service API (Go worker): lead_net only, never through the proxy.
    location /internal/ {
        return 404;
    }

    # Go registers /admin/users and /ws/person/enrich, and /scim is a Python-era path: none are exposed
    # (user decision). Before the SPA moved into api-go these fell to static files; keep them off the
    # catch-all proxy below.
    location ~ ^/(admin|scim|ws)(/|$) {
        return 404;
    }

    # Go-served auth/workspace/mcp-token routes (exact + ^~ locations beat the prefixes below).
    include /etc/nginx/go-routes.conf;

    # ── API routes (REST + WebSocket) ────────────────────
    location /api/ {
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Increase timeouts for long-running enrichments
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Disable buffering for SSE/streaming (chat, workbook updates)
        proxy_buffering off;
    }

    # Authentication routes are mounted at /auth rather than /api/auth.
    location /auth/ {
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Health check passthrough ─────────────────────────
    location /health {
        proxy_pass http://api_backend/health;
    }

    # ── Web UI (React SPA): embedded in the Go API (apps/backend-go/internal/webui) ──
    # api-go serves index.html, hashed /assets/* (immutable cache) and the SPA fallback; every API
    # prefix above/included is matched by a more specific location. The Go handler repeats the
    # security headers, so hide its copies: nginx's server-level add_header values apply once.
    location / {
        proxy_pass http://api_go;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
}
