# ──────────────────────────────────────────────────────────────────
# Nginx reverse proxy for Lead Data
# Routes: / → static React, /api → FastAPI, WebSocket upgrade
# ──────────────────────────────────────────────────────────────────

# Docker replaces a service container (and therefore its bridge IP) on deploy.
# Re-resolve through Docker's embedded DNS so a long-lived nginx process never
# pins a dead API address after `docker compose up`.
resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 5s;

upstream api_backend {
    zone api_backend 64k;
    server api:8000 resolve;
}

server {
    listen 80;
    server_name _;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # ── API routes (REST + WebSocket) ────────────────────
    location /api/ {
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Increase timeouts for long-running enrichments
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Disable buffering for SSE/streaming (chat, workbook updates)
        proxy_buffering off;
    }

    # Authentication routes are mounted at /auth rather than /api/auth.
    location /auth/ {
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Health check passthrough ─────────────────────────
    location /health {
        proxy_pass http://api_backend/health;
    }

    # ── Static frontend (React SPA) ─────────────────────
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Cache static assets aggressively
        location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
}
