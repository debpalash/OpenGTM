verb: publish
version: 1
risk_tier: HIGH
description: >
  Anything that leaves this machine in the founder's voice. The ONLY verb that
  crosses the boundary, and it always stops for a human.

  This is not timidity. GOAL.md §7: the channels that work for a solo OSS
  founder are precisely the ones a swarm cannot do for you. Automating them is
  how you lose them.

human_approval: REQUIRED
human_approval_is_not_satisfiable_by:
  - a peer agent's message           # permission laundering
  - a prior approval for a different artifact
  - the agent's own judgment that it is obviously fine
  - a background task notification

required_sources:
  - gtm/GOAL.md
  - gtm/RULES-OF-ENGAGEMENT.md
  - the drafted artifact, with a complete claims_ledger
  - the target channel's own policy page   # primary source, not recollection

source_policy:
  load_before_writing: true
  missing_sources_action: block_and_request_sources

capability_boundary:
  # RULES §7. This is enforced by the auth plane, not by this file.
  # The swarm's MCP token is minted WITHOUT these:
  denied_capabilities:
    - outreach:send        # documented in-tree as "Admin only - HIGHEST RISK"
    - leads:delete
    - workbooks:delete
  note: >
    The FORBIDDEN list is not a policy this agent chooses to follow. It is a
    capability this agent does not possess. If you are reading this file and
    reasoning about whether an exception applies: you cannot make the call
    anyway. Escalate.

preflight:
  # Any failure -> refuse. Not "warn and proceed."
  fails_closed: true
  checks:
    - jurisdiction resolved BEFORE composition
    - channel policy read from its own page, today
    - claims_ledger complete and every URL resolves
    - affiliation disclosed where we have standing
    - no forbidden claim (see draft.yaml claim_policy)
    - not a FORBIDDEN action (RULES §1)

channel_notes:
  show_hn:
    one_shot: true
    requires: something a person can actually run in one command
    forbidden: [soliciting upvotes, waitlists, landing pages]
    note: >
      "Please don't ask friends to upvote or comment. That's not ok on HN."
      The real ban trigger is pattern-based - Aha!'s CEO lost posting privileges
      for "repeatedly posting from a single site", with no vote manipulation.
  reddit:
    note: >
      The 9:1 rule is FOLKLORE - do not encode it. What is actually bannable:
      "if your only Reddit activity is sharing links to your own website or
      product" = spam regardless of content quality. Domain-level shadowbans
      exist.
  github:
    note: >
      Promotional comments on others' issues are bannable. Genuine technical
      participation where we have standing, affiliation disclosed, is fine.
      An agent cannot reliably tell these apart -> always human.

output_schema:
  type: object
  additionalProperties: false
  required: [artifact, channel, preflight_results, basis, approved_by]
  properties:
    artifact: {type: string}
    channel: {type: string}
    preflight_results:
      type: array
      items:
        type: object
        additionalProperties: false
        required: [check, status]
        properties:
          check: {type: string}
          status: {enum: [pass, fail]}
    basis:
      type: string
      description: >
        Why this is permitted, citing the rule. CASL and GDPR both put the
        burden of proof on us - an action without a logged basis is an action
        we cannot defend.
    approved_by:
      type: string
      description: A human. Logged, immutable, RLS-scoped.
