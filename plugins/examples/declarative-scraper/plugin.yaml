# Example declarative scraper for a fictional company site (acme.example).
# Fixtures only: nothing here depends on a live website.
#   opengtm plugin test plugins/examples/declarative-scraper
manifest_version: "2"
name: acme_team_page
display_name: Acme Team Page (example)
kind: scraper
runtime: declarative
version: 0.1.0
author: OpenGTM
license: Apache-2.0
description: Lists people from a company's /team pages, following pagination.
tags: [example, people, team-page]
capabilities:
  network: ["https://*.acme.example"]
  secrets: []
  browser: false
limits:
  requests_per_second_per_domain: 1
  timeout_seconds: 20
  max_pages: 5
inputs: { domain: string }
outputs: person
scrape:
  start: "https://{{input.domain}}/team"
  items: "css:.team-member"
  fields:
    full_name: "css:.name::text"
    title: "css:.role::text"
    linkedin_url: "css:a.linkedin::attr(href)"
  paginate: { next: "css:a.next::attr(href)", max_pages: 3 }
