description: Unknown domains return 404, reported as http_404 with no fields.
input: {domain: unknown.example}
secrets: {ACME_DATA_API_KEY: test-key}
http:
  - method: GET
    url: https://api.acme-data.example/v1/companies?domain=unknown.example
    status: 404
    headers: {Content-Type: application/json}
    body: '{"detail": "not found"}'
expect:
  error: http_404
  fields: {}
