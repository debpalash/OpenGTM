description: Known company returns firmographics.
input: {domain: acme.example}
secrets: {ACME_DATA_API_KEY: test-key}
http:
  - method: GET
    url: https://api.acme-data.example/v1/companies?domain=acme.example
    status: 200
    headers: {Content-Type: application/json}
    body_file: company.json
expect:
  match: exact
  fields:
    company_size: 250
    industry: Software
    linkedin_url: https://www.linkedin.com/company/acme-example
