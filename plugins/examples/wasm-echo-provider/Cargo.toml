[package]
name = "wasm-echo-provider"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Example OpenGTM WebAssembly provider plugin (extism-pdk)"
publish = false

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
extism-pdk = "1.4"
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"

# Standalone crate: keep it out of any parent Cargo workspace.
[workspace]
