# DRAFT. Copy to .github/workflows/ci.yml to enable.
#
# Runs the backend tests on every pull request and on main. The PostgreSQL job
# runs the row-level-security tests that the default SQLite run skips, on the
# same major version as docker-compose.yml.
#
# Checked locally, not on GitHub: the YAML parses, and the same commands passed
# against SQLite and against PostgreSQL 16 and 18.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  AUTOMATIONS_ENABLED: "false"

jobs:
  sqlite:
    name: Backend tests (SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --frozen --group dev
      - run: uv run pytest -q
      - name: API reference is current
        run: uv run python scripts/export_openapi.py --check

  postgres:
    name: Backend tests (PostgreSQL, row-level security)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gtm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gtm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/gtm_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --frozen --group dev
      - run: uv run pytest -q
