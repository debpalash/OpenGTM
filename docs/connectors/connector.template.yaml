# Provider manifest template. Copy to
# apps/backend-go/internal/manifest/builtin/manifests/<capability>/<name>.yaml
# and fill every value from the vendor's official API documentation.
# Guide: apps/docs/src/content/docs/guides/provider-manifests.md
#
# Docs: https://provider.example/docs/email-finder   (the page you read)
# Auth: how the key is sent, as the vendor documents it.
# Billing: what one call costs, as the vendor documents it. If the vendor does
# not publish a per-call price, keep cost_per_lookup at 0 and say "unknown".
manifest_version: "1"
name: acme_email
display_name: Acme Email Finder
author: your-github-handle
homepage: https://provider.example/docs/email-finder
license: Apache-2.0
tags: [email, enrichment, byok]
capability: email
capabilities: [email]
description: Acme /v1/email/find - first name, last name, domain -> work email.
default_confidence: 0.8
cost_per_lookup: 0
auth:
  type: bearer            # header | bearer | query | none
  env_var: ACME_API_KEY   # never put the key itself in this file
  # secondary:            # optional second credential (key plus secret vendors)
  #   type: header        # header | query
  #   param: X-Acme-Secret
  #   env_var: ACME_SECRET_KEY
request:
  method: POST            # GET | POST | PUT | PATCH
  url: https://api.provider.example/v1/email/find   # https only
  headers:
    Content-Type: application/json
  body:
    first_name: "{{input.first_name}}"
    last_name: "{{input.last_name}}"
    domain: "{{input.domain}}"
  omit_empty: [domain]    # optional: leave these out when the lead has no value
  timeout: 20             # seconds, 1 to 120
response:
  error_path: error       # optional: a truthy value here marks the call failed
  error_message_path: message
  # success_when: {path: $.status, equals: success}   # optional: fail unless this matches
  mappings:
    email: "$.data.email"
  # Optional: translate a vendor word. Needed for email_verify (native words
  # are valid, invalid, catch_all, risky, unknown; default must be unknown).
  # value_maps:
  #   email_verify:
  #     values: {deliverable: valid, undeliverable: invalid}
  #     default: unknown
input_fields: [first_name, last_name, domain]
# Optional: asynchronous vendors. The first request returns an id, this block
# repeats until done_when matches. Write body_template (not body) in poll.request.
# The effective limit is min(max_total, provider_timeout, 120 s); see the guide.
# poll:
#   request:
#     method: GET
#     url: https://api.provider.example/v1/email/find/{{response.id}}
#     timeout: 20
#   interval: 5            # seconds, 0.1 to 60
#   max_attempts: 24       # 1 to 60
#   max_total: 120         # seconds, at most 120
#   done_when: {path: $.status, equals: done}
#   failed_when: {path: $.status, equals: failed}
#   # allowed_hosts: [other-api.provider.example]
