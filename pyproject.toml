[project]
name = "yupcha-engine"
version = "3.0.0"
description = "Yupcha Engine — Document search, lead generation, and intelligence platform"
requires-python = ">=3.11"
dependencies = [
    # FastAPI stack
    "fastapi>=0.128.0",
    "uvicorn[standard]>=0.40.0",
    "sqlalchemy>=2.0.45",
    "alembic>=1.13",
    "pydantic-settings>=2.0.0",
    "slowapi>=0.1.9",
    # Scraping & HTTP
    "beautifulsoup4>=4.12",
    "httpx>=0.28",
    "aiohttp>=3.9",
    "curl-cffi>=0.9",
    "lxml>=6.0",
    "markdownify>=1.2",
    "requests>=2.32",
    # Browser automation
    "playwright>=1.57.0",
    # Lead generation
    "ddgs>=7.0",
    "thefuzz>=0.22",
    "pandas>=2.0",
    # Auth
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.21",
    # Envelope encryption for per-workspace integration secrets (spec WI-6)
    "cryptography>=43.0.0",
    # Email validation
    "dnspython>=2.8.0",
    "email-validator>=2.3.0",
    # PDF processing
    "img2pdf>=0.6.3",
    # LLM SDKs
    "anthropic>=0.40.0",
    # Utilities
    "python-dotenv>=1.0",
    "logfire[fastapi]>=0.51.0",
    "aiofiles>=25.1.0",
    "duckduckgo-search>=8.1.1",
    "redis>=6.4.0",
    "bullmq>=2.25.1",
    "pebble>=5.2.0",
]

[project.scripts]
yupcha = "apps.api.cli:main"

[tool.logfire]
ignore_no_config = true

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
