[project]
name = "opengtm"
version = "3.0.0"
description = "OpenGTM — open-source GTM agents for the world"
requires-python = ">=3.11"
dependencies = [
    # FastAPI stack
    "fastapi>=0.128.0",
    "uvicorn[standard]>=0.40.0",
    "sqlalchemy>=2.0.45",
    "alembic>=1.13",
    # Postgres driver (psycopg3). Required for the default Postgres DATABASE_URL
    # and the shared, RLS-protected multi-tenant leads/signals store. The URL
    # must use the 'postgresql+psycopg://' scheme (psycopg3), not bare
    # 'postgresql://' (which would need psycopg2). Also lets plain `uv run
    # alembic ...` / `uv run python -m apps.api.scripts.seed_demo` work without
    # an ad-hoc `--with psycopg[binary]`. Mirrors apps/api/pyproject.toml.
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.0.0",
    "slowapi>=0.1.9",
    # Scraping & HTTP
    "beautifulsoup4>=4.12",
    "httpx>=0.28",
    "aiohttp>=3.9",
    "curl-cffi>=0.9",
    "lxml>=6.0",
    "markdownify>=1.2",
    "requests>=2.32",
    # Browser automation
    "playwright>=1.57.0",
    # Lead generation
    "ddgs>=7.0",
    "thefuzz>=0.22",
    "pandas>=2.0",
    # Auth
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.21",
    # Envelope encryption for per-workspace integration secrets (spec WI-6)
    "cryptography>=43.0.0",
    # Email validation
    "dnspython>=2.8.0",
    "email-validator>=2.3.0",
    # PDF processing
    "img2pdf>=0.6.3",
    # LLM SDKs
    "anthropic>=0.40.0",
    # Utilities
    "python-dotenv>=1.0",
    "logfire[fastapi]>=0.51.0",
    "aiofiles>=25.1.0",
    "duckduckgo-search>=8.1.1",
    "redis>=6.4.0",
    "bullmq>=2.25.1",
    "pebble>=5.2.0",
    # Billing — Stripe credit top-ups (WI-9)
    "stripe>=11.0.0",
]

[project.optional-dependencies]
# Browser-tier escalation for the lead-sourcing fetch path (apps/api/services/
# leadgen/http.py). These are OPTIONAL: the default fetch path degrades to plain
# HTTP when they're absent. Install with: `uv sync --extra browser` followed by
# `uv run patchright install chromium` for the browser binary.
#   - patchright: stealth-patched Playwright fork (Tier 3 headless browser).
#   - stealth-requests: curl_cffi session wrapper with built-in extractors (Tier 2).
# curl-cffi itself is a core dependency above (Tier 2 TLS/JA3 impersonation).
browser = [
    "patchright>=1.52.0",
    "stealth-requests>=1.2.0",
]

[project.scripts]
# Preferred command. The legacy alias remains so existing automation keeps working.
opengtm = "apps.api.cli:main"
yupcha = "apps.api.cli:main"

[tool.logfire]
ignore_no_config = true

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
# Product tests live here. Network/provider assessment scripts under apps/api
# are operational tools, not import-safe pytest modules.
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--strict-markers"]
markers = [
    "live: opt-in tests that require real network services or credentials",
    "postgres: integration tests that require a PostgreSQL service",
]
