# ──────────────────────────────────────────────────────────────────
# OpenGTM stack. Copy .env.example to .env first (or run scripts/install.sh). SECRET_KEY (>= 32 bytes) is REQUIRED:
# the Go api/worker/mcp refuse to start with an empty or short key unless APP_ENV=test, and compose fails fast
# without it. Other variables have development defaults.
#
# PREREQUISITE: the Python backend lives in ./legacy/python, which is its own git
# repo and is gitignored here. It must be cloned into ./legacy/python before the
# Python images (api, seed [demo profile], worker, scheduler) can build;
# the root Dockerfile stops with an explicit message otherwise. The Go images build
# from ./apps/backend-go and need nothing else. See docs/go-port/runbooks/docker-compose.md.
#
# Default `docker compose up` = api-go (UI embedded) + the Python api/worker/scheduler behind nginx. nginx
# go-split.conf at 0% sends the canary routes to Python; /auth/setup*, /auth/sso/* and the public outreach
# unsubscribe/bounce routes are always Go. Opt-in profiles: `go` (worker-go), `mcp`, `demo` (seed: admin/admin,
# demo hosts only), `reacher`, `bench`. First run: open /setup; the one-time setup
# token is in `docker compose logs api-go`.
# ──────────────────────────────────────────────────────────────────
services:
  # ── Postgres (primary store — MVCC, real concurrent writers) ───
  # The workbook enrichment run depends on concurrent writers; SQLite would
  # hit "database is locked". This is the documented Postgres default actually
  # wired up. Credentials below match the DATABASE_URL the api/worker use.
  postgres:
    image: postgres:16-alpine
    container_name: lead-data-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-yupcha}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-yupcha}
      - POSTGRES_DB=${POSTGRES_DB:-yupcha}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Host-local only for admin tools; application containers use lead_net.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-yupcha} -d ${POSTGRES_DB:-yupcha}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - lead_net

  # ── Schema migration (single owner; must finish before app startup) ──
  migrate:
    # One-shot schema owner: the Go runner (internal/migrate, goose) from the api-go image.
    # Empty database -> baseline; Alembic database at e7b2c4d6f8a0 -> adopted; any other
    # Alembic revision -> refused (upgrade it with legacy/python first). It keeps
    # alembic_version at e7b2c4d6f8a0 so the Python services still pass their head check,
    # and provisions the runtime login like the old Python job. Concurrent runs are safe
    # (advisory lock). See docs/go-port/runbooks/migrations.md.
    build:
      context: ./apps/backend-go
      dockerfile: Dockerfile
      target: api
      additional_contexts:
        web: ./apps/web
    image: opengtm-api-go:local
    entrypoint: ["/opengtm-migrate"]
    command: ["up"]
    environment:
      # Owner credentials (DDL, CREATE ROLE). A SQLAlchemy postgresql+psycopg:// URL is accepted.
      - DATABASE_URL=${DATABASE_URL:-postgresql://yupcha:yupcha@postgres:5432/yupcha}
      - YUPCHA_APP_DB_ROLE=${YUPCHA_APP_DB_ROLE:-yupcha_app}
      - YUPCHA_PROVISION_RUNTIME_ROLE=1
      - YUPCHA_RUNTIME_DB_USER=${YUPCHA_RUNTIME_DB_USER:-yupcha_runtime}
      - YUPCHA_RUNTIME_DB_PASSWORD=${YUPCHA_RUNTIME_DB_PASSWORD:-yupcha_runtime}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - lead_net

  # ── API (FastAPI backend) ──────────────────────────────
  api:
    image: ${YUPCHA_IMAGE:-lead-data-app:local}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lead-data-api
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    env_file:
      - path: .env
        required: false
    environment:
      # Postgres is the source of truth. This overrides any SQLite DB_PATH and
      # makes the documented Postgres default take effect. ${VAR:-default} lets
      # .env override without editing this file.
      - DATABASE_URL=${APP_DATABASE_URL:-postgresql+psycopg://yupcha_runtime:yupcha_runtime@postgres:5432/yupcha}
      - PYTHONPATH=/app
      - REDIS_URL=redis://redis:6379
      # Self-hosted Reacher endpoint (internal only). Inert unless REACHER_ENABLED
      # is also set in .env — default OFF means this URL is simply never called.
      - REACHER_URL=${REACHER_URL:-http://reacher:8080}
      # Job processing is owned by the standalone `worker` service below, which
      # claims jobs atomically (FOR UPDATE SKIP LOCKED) and is safe to scale to
      # N replicas. Turn OFF the in-API worker so the API only enqueues — this is
      # what makes horizontal scaling double-charge-safe.
      - RUN_INLINE_WORKER=0
      # The one-shot migrate service above owns schema evolution.
      - YUPCHA_DB_INIT=skip
    volumes:
      # data/ still holds the workspaces.db (sqlite meta) + per-workspace leads;
      # the primary store is Postgres.
      - ./data:/app/data
    ports:
      # Host-local diagnostics only. LAN traffic goes through nginx on 3010.
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - lead_net

  # ── Seed (OPT-IN demo: admin + populated zero-key workbook) ──
  # Profile `demo`: NOT started by a default `docker compose up`. The first real admin is
  # created by the user in the UI (/setup, served by api-go). Only run this for a throwaway
  # demo (`docker compose --profile demo up`); it creates SEED_ADMIN_* (default admin/admin).
  # Runs once after Postgres is healthy, creates the demo workspace/workbook
  # and enqueues the first enrichment run. Idempotent — safe on every restart.
  seed:
    profiles: ["demo"]
    image: ${YUPCHA_IMAGE:-lead-data-app:local}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lead-data-seed
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    env_file:
      - path: .env
        required: false
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg://yupcha:yupcha@postgres:5432/yupcha}
      - PYTHONPATH=/app
      - REDIS_URL=redis://redis:6379
      - YUPCHA_DB_INIT=skip
    volumes:
      - ./data:/app/data
    command: python -m apps.api.scripts.seed_demo
    depends_on:
      postgres:
        condition: service_healthy
      # Wait for the API after the one-shot migration has completed. The seed
      # enqueues work for the standalone worker.
      api:
        condition: service_healthy
    restart: "no"
    networks:
      - lead_net

  # ── Job Worker (durable SQL queue, FOR UPDATE SKIP LOCKED) ─────
  # Standalone processor for the `jobs` table. Claims jobs atomically so it is
  # safe to scale horizontally: `docker compose up --scale worker=N`. Each
  # replica grabs each queued job exactly once (no double-grab / double-charge).
  worker:
    image: ${YUPCHA_IMAGE:-lead-data-app:local}
    build:
      context: .
      dockerfile: Dockerfile
    # NOTE: no fixed container_name so `--scale worker=N` can run multiple.
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    env_file:
      - path: .env
        required: false
    environment:
      - DATABASE_URL=${APP_DATABASE_URL:-postgresql+psycopg://yupcha_runtime:yupcha_runtime@postgres:5432/yupcha}
      - PYTHONPATH=/app
      - REDIS_URL=redis://redis:6379
      - REACHER_URL=${REACHER_URL:-http://reacher:8080}
      - YUPCHA_DB_INIT=skip
    volumes:
      - ./data:/app/data
    command: python -m apps.api.worker
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # The worker deliberately exposes no HTTP port. Its liveness contract is
      # that the PID 1 worker process still exists; queue readiness is reported
      # separately through worker/job heartbeats in Postgres.
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - lead_net

  # ── Recurring job scheduler (single reconciliation owner) ─────
  scheduler:
    image: ${YUPCHA_IMAGE:-lead-data-app:local}
    build:
      context: .
      dockerfile: Dockerfile
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    env_file:
      - path: .env
        required: false
    environment:
      - DATABASE_URL=${APP_DATABASE_URL:-postgresql+psycopg://yupcha_runtime:yupcha_runtime@postgres:5432/yupcha}
      - PYTHONPATH=/app
      - YUPCHA_DB_INIT=skip
      - SCHEDULER_RECONCILE_SECONDS=${SCHEDULER_RECONCILE_SECONDS:-60}
    volumes:
      - ./data:/app/data
    command: python -m apps.api.scheduler
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - lead_net

  # ── Reacher (OPTIONAL self-hosted email verification) ──────────
  # Strongest tier of the email cascade: unlimited, $0/email SMTP RCPT probing
  # (safe/risky/invalid/unknown + catch-all + disposable + role). DUAL-LICENSED
  # AGPL-3.0 OR commercial — we run the AGPL build as a separate networked
  # process (unambiguously compliant; no GPL contamination of Yupcha's code).
  #
  # NOT started by default. Enable with:  docker compose --profile reacher up
  # Then set REACHER_ENABLED=1 (and a header secret) in .env to wire it into the
  # cascade. Without the profile, `docker compose up` is byte-for-byte unchanged.
  #
  # PORT-25 CAVEAT: Reacher does real outbound :25 RCPT probes. Most clouds block
  # egress on :25, so without port-25 access or a SOCKS5 proxy (RCH__PROXY__*)
  # Reacher returns mostly `unknown` and the cascade correctly falls back to the
  # bundled SMTP probe / HTTP vendors. For hosted SaaS the realistic path is the
  # commercial Reacher cloud API (set REACHER_API_KEY, leave this profile off).
  #
  # NOT published on a host port (internal lead_net only) — never expose it.
  reacher:
    image: reacherhq/backend:v0.10.0   # pinned (do NOT track `latest`)
    container_name: lead-data-reacher
    profiles: [reacher]
    environment:
      - RCH__BACKEND_NAME=yupcha-reacher
      - RCH__HTTP_HOST=0.0.0.0
      - RCH__SMTP__FROM_EMAIL=${REACHER_FROM_EMAIL:-verify@yupcha.com}
      - RCH__SMTP__HELLO_NAME=${REACHER_HELLO_NAME:-verify.yupcha.com}
      # Header secret — clients must send `Authorization: Bearer <secret>`.
      # Set REACHER_API_KEY in .env to the same value so the cascade authenticates.
      - RCH__HEADER_SECRET=${REACHER_API_KEY:-}
      # Optional SOCKS5 proxy to escape blocked port-25 egress (operator-supplied):
      # - RCH__PROXY__HOST=${REACHER_PROXY_HOST:-}
      # - RCH__PROXY__PORT=${REACHER_PROXY_PORT:-}
      # - RCH__PROXY__USERNAME=${REACHER_PROXY_USERNAME:-}
      # - RCH__PROXY__PASSWORD=${REACHER_PROXY_PASSWORD:-}
    restart: unless-stopped
    networks:
      - lead_net

  # ── Redis (live pub/sub; durable jobs live in Postgres) ─────────
  redis:
    image: redis:7-alpine
    container_name: lead-data-redis
    ports:
      # Redis has no authentication in this self-host profile; never expose it
      # to the LAN. Containers reach it through the private lead_net network.
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - lead_net

  # ── Nginx (reverse proxy; the UI is served by api-go) ───────────────
  nginx:
    image: nginx:alpine
    container_name: lead-data-web
    ports:
      - "${PORT:-3000}:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/nginx/go-split.conf:/etc/nginx/go-split.conf:ro
      - ./infra/nginx/go-routes.conf:/etc/nginx/go-routes.conf:ro
    depends_on:
      api:
        condition: service_healthy
      api-go:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - lead_net

  # ── Go API (runs in a default `up`: first-run setup and /auth live here) ──
  # nginx sends it traffic only when the canary percentage in
  # infra/nginx/go-split.conf is raised (shipped at 0% = all Python), so starting
  # it is harmless. It shares SECRET_KEY/DATABASE with the Python API and refuses
  # to start unless goose_db_version is at config.RequiredGoSchemaVersion (hence `migrate`).
  # Every GO_* route/executor flag defaults OFF here: raise them per runbook.
  api-go:
    build:
      context: ./apps/backend-go
      dockerfile: Dockerfile
      target: api
      # The api image embeds the web UI: its Dockerfile builds this context with Bun.
      additional_contexts:
        web: ./apps/web
    image: opengtm-api-go:local
    environment:
      - API_ADDR=:8000
      # pgx takes a plain postgresql:// URL (not the SQLAlchemy +psycopg form) and
      # must use the non-superuser runtime role so forced RLS applies.
      - DATABASE_URL=${GO_DATABASE_URL:-postgresql://yupcha_runtime:yupcha_runtime@postgres:5432/yupcha}
      - REDIS_URL=redis://redis:6379
      - APP_ENV=${APP_ENV:-dev}
      # First-admin setup (POST /auth/setup). SETUP_TOKEN empty = a random token is logged once at
      # start while no admin exists. SETUP_TOKEN_DISABLED=1 = open setup (APP_ENV never opens it).
      - SETUP_TOKEN=${SETUP_TOKEN:-}
      - SETUP_TOKEN_DISABLED=${SETUP_TOKEN_DISABLED:-}
      # Must equal the Python api's SECRET_KEY so tokens cross over. Required, >= 32 bytes: the Go process
      # refuses to start otherwise (only APP_ENV=test relaxes this; APP_ENV=dev does not).
      - SECRET_KEY=${SECRET_KEY:-}  # services refuse to start without a >=32-byte key (see .env.example)
      - SECRETS_PROVIDER=${SECRETS_PROVIDER:-}
      - SECRETS_MASTER_KEY=${SECRETS_MASTER_KEY:-}
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:-}
      # Calls back into the Python API (research steps, copilot) over lead_net.
      - PY_WORKER_URL=${PY_WORKER_URL:-http://api:8000}
      - PY_WORKER_TOKEN=${PY_WORKER_TOKEN:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      # nginx is the only client on lead_net: trust its X-Real-IP. lead_net has a fixed subnet
      # (LEAD_NET_SUBNET), which is the default trusted range; bridge/LAN peers outside it are untrusted.
      - TRUST_PROXY_CIDRS=${TRUST_PROXY_CIDRS:-${LEAD_NET_SUBNET:-172.29.250.0/24}}
      # Outreach (GO_OUTREACH_ROUTES_ENABLED / GO_EXECUTOR_OUTREACH_SEND): needs https here unless APP_ENV=dev.
      - OUTREACH_PUBLIC_BASE_URL=${OUTREACH_PUBLIC_BASE_URL:-}
      - PG_LEAD_STORE=${PG_LEAD_STORE:-true}
      # Route/executor flags: ALL OFF until the matching runbook says otherwise.
      - GO_EXECUTOR_ENABLED=${GO_EXECUTOR_ENABLED:-false}
      - GO_EXECUTOR_WORKSPACES=${GO_EXECUTOR_WORKSPACES:-}
      - GO_RUN_ROUTES_ENABLED=${GO_RUN_ROUTES_ENABLED:-false}
      - GO_AUDIENCE_ROUTES_ENABLED=${GO_AUDIENCE_ROUTES_ENABLED:-false}
      - GO_DEST_ROUTES_ENABLED=${GO_DEST_ROUTES_ENABLED:-false}
      - GO_AUTOMATION_ROUTES_ENABLED=${GO_AUTOMATION_ROUTES_ENABLED:-false}
      - GO_COLLECTION_ROUTES_ENABLED=${GO_COLLECTION_ROUTES_ENABLED:-false}
      - GO_CONNECTOR_ROUTES_ENABLED=${GO_CONNECTOR_ROUTES_ENABLED:-false}
      - GO_GOVERNANCE_ROUTES_ENABLED=${GO_GOVERNANCE_ROUTES_ENABLED:-false}
      - GO_OUTREACH_ROUTES_ENABLED=${GO_OUTREACH_ROUTES_ENABLED:-false}
      - GO_PLAYBOOK_ROUTES_ENABLED=${GO_PLAYBOOK_ROUTES_ENABLED:-false}
      - GO_AI_BATCH_ENABLED=${GO_AI_BATCH_ENABLED:-false}
      - COPILOT_GO_ENABLED=${COPILOT_GO_ENABLED:-false}
      # Internal browser service (--profile browser); reached over browser_net only.
      - BROWSER_SERVICE_URL=${BROWSER_SERVICE_URL:-http://browser:8090}
      - BROWSER_SERVICE_TOKEN=${BROWSER_SERVICE_TOKEN:-}
    ports:
      # Host-local diagnostics only; public traffic goes through nginx.
      - "127.0.0.1:${API_GO_PORT:-8001}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Distroless: no shell/curl. `/api -healthcheck` GETs 127.0.0.1:8000/healthz.
      test: ["CMD", "/api", "-healthcheck"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      lead_net:
        # nginx upstreams and scripts/nginx-routing-check.sh address it by this name.
        aliases: [api-go]
      browser_net: {}

  # ── Go workbook executor (opt-in: --profile go) ──
  # Claims only jobs with executor='go' (routed by the API per GO_EXECUTOR_ENABLED /
  # GO_EXECUTOR_WORKSPACES; both default OFF, so it idles). No published ports.
  # Needs INTERNAL_SERVICE_TOKEN (>= 32 chars, same value as the Python api) or it exits at
  # boot with a config error. Liveness is the DB heartbeat (the image is distroless
  # and exposes no HTTP probe); see docs/go-port/runbooks.
  worker-go:
    profiles: ["go"]
    build:
      context: ./apps/backend-go
      dockerfile: Dockerfile
      target: worker
    image: opengtm-worker-go:local
    environment:
      - DATABASE_URL=${GO_DATABASE_URL:-postgresql://yupcha_runtime:yupcha_runtime@postgres:5432/yupcha}
      - REDIS_URL=redis://redis:6379
      - INTERNAL_API_URL=http://api:8000
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:-}
      - PY_WORKER_URL=${PY_WORKER_URL:-http://api:8000}
      - PY_WORKER_TOKEN=${PY_WORKER_TOKEN:-}
      - APP_ENV=${APP_ENV:-dev}
      - SECRET_KEY=${SECRET_KEY:-}  # services refuse to start without a >=32-byte key (see .env.example)
      - SECRETS_PROVIDER=${SECRETS_PROVIDER:-}
      - SECRETS_MASTER_KEY=${SECRETS_MASTER_KEY:-}
      - PG_LEAD_STORE=${PG_LEAD_STORE:-true}
      - GO_EXECUTOR_ENABLED=${GO_EXECUTOR_ENABLED:-false}
      - GO_EXECUTOR_WORKSPACES=${GO_EXECUTOR_WORKSPACES:-}
      - GO_WORKER_CONCURRENCY=${GO_WORKER_CONCURRENCY:-4}
      - GO_WORKER_DB_MAX_CONNS=${GO_WORKER_DB_MAX_CONNS:-20}
      - GO_WORKER_HEARTBEAT_SECONDS=${GO_WORKER_HEARTBEAT_SECONDS:-10}
      - GO_WORKER_SHUTDOWN_GRACE_SECONDS=${GO_WORKER_SHUTDOWN_GRACE_SECONDS:-30}
      - GO_WORKER_DEBUG_ADDR=${GO_WORKER_DEBUG_ADDR:-127.0.0.1:6060}
      - WORKER_MAX_ACTIVE_PER_WORKSPACE=${WORKER_MAX_ACTIVE_PER_WORKSPACE:-2}
      # Outreach send: default off; when on, OUTREACH_PUBLIC_BASE_URL must be https unless APP_ENV=dev.
      - GO_EXECUTOR_OUTREACH_SEND=${GO_EXECUTOR_OUTREACH_SEND:-false}
      - OUTREACH_PUBLIC_BASE_URL=${OUTREACH_PUBLIC_BASE_URL:-}
      - BROWSER_SERVICE_URL=${BROWSER_SERVICE_URL:-http://browser:8090}
      - BROWSER_SERVICE_TOKEN=${BROWSER_SERVICE_TOKEN:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - lead_net
      - browser_net

  # ── Internal browser service (opt-in: --profile browser) ──
  # Playwright Chromium + scraper libraries (apps/browser-service), called only by api-go /
  # worker-go with BROWSER_SERVICE_TOKEN (>= 32 chars; it refuses to start without one).
  # No published port: browser_net is internal (no route out) and is shared only with the
  # Go services; browser_egress is its own internet path, which nothing else joins. All page
  # traffic goes through the in-process egress proxy (private/metadata IPs refused, DNS pinned).
  # See docs/go-port/runbooks/browser-service.md.
  browser:
    profiles: ["browser"]
    build:
      context: ./apps/browser-service
    image: opengtm-browser:local
    environment:
      - BROWSER_SERVICE_TOKEN=${BROWSER_SERVICE_TOKEN:-}
      - BROWSER_MAX_CONCURRENCY=${BROWSER_MAX_CONCURRENCY:-4}
      - BROWSER_MAX_TIMEOUT_S=${BROWSER_MAX_TIMEOUT_S:-180}
      - BROWSER_MAX_RESPONSE_BYTES=${BROWSER_MAX_RESPONSE_BYTES:-5242880}
      # FlareSolverr engine (optional): its browser may fetch only through our egress proxy, so
      # FLARESOLVERR_URL requires BROWSER_EGRESS_PROXY_LISTEN=0.0.0.0:8091 and
      # BROWSER_EGRESS_PROXY_URL=http://browser:8091 (the service refuses to start otherwise).
      - FLARESOLVERR_URL=${FLARESOLVERR_URL:-}
      - BROWSER_EGRESS_PROXY_LISTEN=${BROWSER_EGRESS_PROXY_LISTEN:-}
      - BROWSER_EGRESS_PROXY_URL=${BROWSER_EGRESS_PROXY_URL:-}
      # destination ports the egress proxy may open; Chromium sandbox (needs the security_opt in
      # docs/go-port/runbooks/browser-service.md); patchright for Google Maps; LinkedIn roster
      # scraping (LinkedIn ToS: off unless opted in; cookies come per request from Go)
      - BROWSER_EGRESS_PORTS=${BROWSER_EGRESS_PORTS:-80,443}
      - BROWSER_CHROMIUM_SANDBOX=${BROWSER_CHROMIUM_SANDBOX:-true}
      - BROWSER_MAPS_STEALTH=${BROWSER_MAPS_STEALTH:-false}
      - BROWSER_STAFFSPY_ENABLED=${BROWSER_STAFFSPY_ENABLED:-false}
    read_only: true
    tmpfs:
      - /tmp
      - /home/browser
    shm_size: "1gb"
    mem_limit: ${BROWSER_MEM_LIMIT:-2g}
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - browser_net
      - browser_egress

  # ── Go MCP server, SSE transport (opt-in: --profile mcp) ──
  # Replaces `python -m apps.mcp.server --sse`. Internal only (no host port); clients
  # on lead_net reach http://mcp:3100. stdio use is `opengtm-mcp` run directly.
  mcp:
    profiles: ["mcp"]
    build:
      context: ./apps/backend-go
      dockerfile: Dockerfile
      target: mcp
    image: opengtm-mcp-go:local
    command: ["--sse", "3100"]
    environment:
      - DATABASE_URL=${GO_DATABASE_URL:-postgresql://yupcha_runtime:yupcha_runtime@postgres:5432/yupcha}
      - OPENGTM_MCP_SSE_HOST=0.0.0.0
      - APP_ENV=${APP_ENV:-dev}
      - SECRET_KEY=${SECRET_KEY:-}  # services refuse to start without a >=32-byte key (see .env.example)
      - SECRETS_PROVIDER=${SECRETS_PROVIDER:-}
      - SECRETS_MASTER_KEY=${SECRETS_MASTER_KEY:-}
      - PY_WORKER_URL=${PY_WORKER_URL:-http://api:8000}
      - PY_WORKER_TOKEN=${PY_WORKER_TOKEN:-}
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - lead_net

  # ── Benchmark-only provider simulator (docker compose --profile bench) ──
  providersim:
    profiles: ["bench"]
    build:
      context: ./apps/backend-go
      dockerfile: Dockerfile.providersim
    environment:
      - SIM_ADDR=:8099
      - SIM_PROFILE=${SIM_PROFILE:-ok}
      - SIM_SEED=${SIM_SEED:-1}
      - SIM_NOMATCH_EVERY=${SIM_NOMATCH_EVERY:-0}
    restart: "no"
    networks:
      - lead_net

volumes:
  pgdata:
  redisdata:

networks:
  # Go services <-> browser service only; internal = no route to the outside.
  browser_net:
    internal: true
  # The browser service's own way out (nothing else attaches to it).
  browser_egress:
    driver: bridge
  lead_net:
    driver: bridge
    ipam:
      config:
        - subnet: ${LEAD_NET_SUBNET:-172.29.250.0/24}
