# ──────────────────────────────────────────────────────────────────
# OpenGTM stack (Go). Copy .env.example to .env first (or run scripts/install.sh, which generates the secrets).
# Required in .env: SECRET_KEY (>= 32 bytes), INTERNAL_SERVICE_TOKEN (>= 32 chars) and BROWSER_SERVICE_TOKEN
# (>= 32 chars). The Go services and the browser service refuse to start without them. Other variables have
# development defaults.
#
# Default `docker compose up`: postgres, redis, migrate (one-shot), api-go (API + embedded web UI), worker-go,
# scheduler-go, browser (internal browser service) and nginx. Every Go-native path is on (GO_ALL_NATIVE=true):
# there is no Python fallback. Opt-in profiles: `mcp` (MCP server, SSE), `demo` (seed-go: demo workbook),
# `reacher` (email verification), `bench` (provider simulator).
# First run: open /setup; the one-time setup token is in `docker compose logs api-go`.
# See docs/go-port/runbooks/docker-compose.md.
# ──────────────────────────────────────────────────────────────────

# Shared by the Go services. The runtime role is a non-superuser without BYPASSRLS, so forced RLS applies; its
# password is the one `migrate` provisions (YUPCHA_RUNTIME_DB_PASSWORD, generated by scripts/install.sh).
x-go-env: &go-env
  DATABASE_URL: ${GO_DATABASE_URL:-postgresql://${YUPCHA_RUNTIME_DB_USER:-yupcha_runtime}:${YUPCHA_RUNTIME_DB_PASSWORD:?YUPCHA_RUNTIME_DB_PASSWORD is required - run scripts/install.sh or set it in .env}@postgres:5432/${POSTGRES_DB:-yupcha}}
  REDIS_URL: redis://redis:6379
  APP_ENV: ${APP_ENV:-dev}
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required - run scripts/install.sh or set it in .env (see .env.example)}
  SECRETS_PROVIDER: ${SECRETS_PROVIDER:-}
  SECRETS_MASTER_KEY: ${SECRETS_MASTER_KEY:-}
  INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required - run scripts/install.sh or set it in .env (see .env.example)}
  # Credentials are resolved in-process from Postgres (there is no Python credentials endpoint).
  CREDENTIALS_SOURCE: local
  PG_LEAD_STORE: "true"
  # Master switch: every GO_* route/executor flag that is not set explicitly is on (internal/config/allnative.go).
  GO_ALL_NATIVE: "true"
  # Not covered by the master switch.
  COPILOT_GO_ENABLED: "true"
  GO_AI_BATCH_ENABLED: "true"
  # Outreach: OUTREACH_PUBLIC_BASE_URL must be https unless APP_ENV=dev.
  OUTREACH_PUBLIC_BASE_URL: ${OUTREACH_PUBLIC_BASE_URL:-}
  # Internal browser service, reached over browser_net only.
  BROWSER_SERVICE_URL: ${BROWSER_SERVICE_URL:-http://browser:8090}
  BROWSER_SERVICE_TOKEN: ${BROWSER_SERVICE_TOKEN:?BROWSER_SERVICE_TOKEN is required - run scripts/install.sh or set it in .env (see .env.example)}

services:
  # ── Postgres (primary store) ───
  postgres:
    image: postgres:16-alpine
    container_name: lead-data-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-yupcha}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required - run scripts/install.sh or set it in .env (see .env.example)}
      - POSTGRES_DB=${POSTGRES_DB:-yupcha}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Host-local only for admin tools; application containers use lead_net.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-yupcha} -d ${POSTGRES_DB:-yupcha}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - lead_net

  # ── Schema migration (single owner; must finish before app startup) ──
  migrate:
    # One-shot schema owner: the Go runner (internal/migrate, goose). Empty database -> baseline; an existing
    # Alembic database at the final revision -> adopted; any other Alembic revision -> refused. It provisions
    # the runtime login. Concurrent runs are safe (advisory lock). See docs/go-port/runbooks/migrations.md.
    build:
      context: ./apps/backend-go
      dockerfile: Dockerfile
      target: migrate
    image: opengtm-migrate-go:local
    environment:
      # Owner credentials (DDL, CREATE ROLE). A SQLAlchemy postgresql+psycopg:// URL is accepted.
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-yupcha}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required - run scripts/install.sh or set it in .env}@postgres:5432/${POSTGRES_DB:-yupcha}}
      - YUPCHA_APP_DB_ROLE=${YUPCHA_APP_DB_ROLE:-yupcha_app}
      - YUPCHA_PROVISION_RUNTIME_ROLE=1
      - YUPCHA_RUNTIME_DB_USER=${YUPCHA_RUNTIME_DB_USER:-yupcha_runtime}
      - YUPCHA_RUNTIME_DB_PASSWORD=${YUPCHA_RUNTIME_DB_PASSWORD:?YUPCHA_RUNTIME_DB_PASSWORD is required - run scripts/install.sh or set it in .env (see .env.example)}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - lead_net

  # ── Go API (API + embedded web UI; first-run setup and /auth live here) ──
  # It refuses to start unless goose_db_version is at config.RequiredGoSchemaVersion (hence `migrate`).
  api-go:
    build:
      context: ./apps/backend-go
      dockerfile: Dockerfile
      target: api
      # The api image embeds the web UI: its Dockerfile builds this context with Bun.
      additional_contexts:
        web: ./apps/web
    image: opengtm-api-go:local
    # Provider/LLM keys, Google CSE keys, LINKEDIN_LI_AT_COOKIE, SMTP, SSO etc. come from .env.
    env_file:
      - path: .env
        required: false
    environment:
      <<: *go-env
      API_ADDR: ":8000"
      # First-admin setup (POST /auth/setup). SETUP_TOKEN empty = a random token is logged once at
      # start while no admin exists. SETUP_TOKEN_DISABLED=1 = open setup (APP_ENV never opens it).
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      SETUP_TOKEN_DISABLED: ${SETUP_TOKEN_DISABLED:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      # nginx is the only client on lead_net: trust its X-Real-IP. lead_net has a fixed subnet
      # (LEAD_NET_SUBNET), which is the default trusted range; bridge/LAN peers outside it are untrusted.
      TRUST_PROXY_CIDRS: ${TRUST_PROXY_CIDRS:-${LEAD_NET_SUBNET:-172.29.250.0/24}}
    ports:
      # Host-local diagnostics only; public traffic goes through nginx.
      - "127.0.0.1:${API_GO_PORT:-8001}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Distroless: no shell/curl. `/api -healthcheck` GETs 127.0.0.1:8000/healthz.
      test: ["CMD", "/api", "-healthcheck"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      lead_net:
        # nginx upstream addresses it by this name.
        aliases: [api-go]
      browser_net: {}

  # ── Go job worker (durable SQL queue, FOR UPDATE SKIP LOCKED) ──
  # Safe to scale: `docker compose up --scale worker-go=N`. No published ports; liveness is the DB
  # heartbeat (distroless image, no HTTP probe).
  worker-go:
    build:
      context: ./apps/backend-go
      dockerfile: Dockerfile
      target: worker
    image: opengtm-worker-go:local
    env_file:
      - path: .env
        required: false
    environment:
      <<: *go-env
      INTERNAL_API_URL: http://api-go:8000
      REACHER_URL: ${REACHER_URL:-http://reacher:8080}
      GO_WORKER_CONCURRENCY: ${GO_WORKER_CONCURRENCY:-4}
      GO_WORKER_DB_MAX_CONNS: ${GO_WORKER_DB_MAX_CONNS:-20}
      GO_WORKER_HEARTBEAT_SECONDS: ${GO_WORKER_HEARTBEAT_SECONDS:-10}
      GO_WORKER_SHUTDOWN_GRACE_SECONDS: ${GO_WORKER_SHUTDOWN_GRACE_SECONDS:-30}
      GO_WORKER_DEBUG_ADDR: ${GO_WORKER_DEBUG_ADDR:-127.0.0.1:6060}
      WORKER_MAX_ACTIVE_PER_WORKSPACE: ${WORKER_MAX_ACTIVE_PER_WORKSPACE:-2}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - lead_net
      - browser_net

  # ── Recurring job scheduler (single reconciliation owner) ──
  # A Postgres advisory lock keeps exactly one instance active; extra replicas idle.
  scheduler-go:
    build:
      context: ./apps/backend-go
      dockerfile: Dockerfile
      target: scheduler
    image: opengtm-scheduler-go:local
    env_file:
      - path: .env
        required: false
    environment:
      <<: *go-env
      GO_SCHEDULER_ENABLED: "true"
      SCHEDULER_RECONCILE_SECONDS: ${SCHEDULER_RECONCILE_SECONDS:-60}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - lead_net

  # ── Demo seed (OPT-IN: docker compose --profile demo up) ──
  # Seeds a zero-key demo workbook into the workspace that first-run setup created and starts its first run
  # through the API. It never creates a user: complete /setup first. It waits SEED_WAIT_SECONDS for setup,
  # then exits 3 (re-run it after /setup). Idempotent.
  seed-go:
    profiles: ["demo"]
    image: opengtm-scheduler-go:local
    build:
      context: ./apps/backend-go
      dockerfile: Dockerfile
      target: scheduler
    entrypoint: ["/opengtm-seed"]
    environment:
      <<: *go-env
      SEED_API_URL: http://api-go:8000
      SEED_WAIT_SECONDS: ${SEED_WAIT_SECONDS:-600}
      SEED_WORKSPACE_SLUG: ${SEED_WORKSPACE_SLUG:-main}
      SEED_FORCE_RUN: ${SEED_FORCE_RUN:-}
    depends_on:
      api-go:
        condition: service_healthy
    restart: "no"
    networks:
      - lead_net

  # ── Internal browser service ──
  # Playwright Chromium + scraper libraries (apps/browser-service), called only by api-go / worker-go with
  # BROWSER_SERVICE_TOKEN (>= 32 chars; it refuses to start without one). No database, no other secrets
  # (no env_file), no published port: browser_net is internal (no route out) and is shared only with the Go
  # services; browser_egress is its own internet path, which nothing else joins. All page traffic goes through
  # the in-process egress proxy (private/metadata IPs refused, DNS pinned). The proxy runs inside this
  # container (splitting it out needs a session protocol between the two processes; see the runbook).
  # See docs/go-port/runbooks/browser-service.md.
  browser:
    build:
      context: ./apps/browser-service
    image: opengtm-browser:local
    environment:
      - BROWSER_SERVICE_TOKEN=${BROWSER_SERVICE_TOKEN:?BROWSER_SERVICE_TOKEN is required - run scripts/install.sh or set it in .env (see .env.example)}
      - BROWSER_MAX_CONCURRENCY=${BROWSER_MAX_CONCURRENCY:-4}
      - BROWSER_MAX_TIMEOUT_S=${BROWSER_MAX_TIMEOUT_S:-180}
      - BROWSER_MAX_RESPONSE_BYTES=${BROWSER_MAX_RESPONSE_BYTES:-5242880}
      # FlareSolverr engine (optional): its browser may fetch only through our egress proxy, so
      # FLARESOLVERR_URL requires BROWSER_EGRESS_PROXY_LISTEN=0.0.0.0:8091 and
      # BROWSER_EGRESS_PROXY_URL=http://browser:8091 (the service refuses to start otherwise).
      - FLARESOLVERR_URL=${FLARESOLVERR_URL:-}
      - BROWSER_EGRESS_PROXY_LISTEN=${BROWSER_EGRESS_PROXY_LISTEN:-}
      - BROWSER_EGRESS_PROXY_URL=${BROWSER_EGRESS_PROXY_URL:-}
      # destination ports the egress proxy may open; Chromium sandbox (needs the security_opt below);
      # patchright for Google Maps; LinkedIn roster scraping (LinkedIn ToS: off unless opted in; cookies come
      # per request from Go)
      - BROWSER_EGRESS_PORTS=${BROWSER_EGRESS_PORTS:-80,443}
      - BROWSER_CHROMIUM_SANDBOX=${BROWSER_CHROMIUM_SANDBOX:-true}
      - BROWSER_MAPS_STEALTH=${BROWSER_MAPS_STEALTH:-false}
      - BROWSER_STAFFSPY_ENABLED=${BROWSER_STAFFSPY_ENABLED:-false}
    read_only: true
    tmpfs:
      - /tmp
      - /home/browser
    shm_size: "1gb"
    mem_limit: ${BROWSER_MEM_LIMIT:-2g}
    # split mode: the entrypoint starts as root with only SETUID/SETGID, runs Chromium as uid 10002 and the
    # service as uid 10001, then every process drops all capabilities (docs/go-port/runbooks/browser-service.md)
    user: "0"
    init: true
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID]
    # Chromium's own sandbox needs namespace syscalls (seccomp profile) and the uid_map write (AppArmor)
    security_opt:
      - no-new-privileges:true
      - seccomp=./apps/browser-service/seccomp-chromium.json
      - apparmor=unconfined
    restart: unless-stopped
    networks:
      - browser_net
      - browser_egress

  # ── Nginx (reverse proxy in front of api-go) ───────────────
  nginx:
    image: nginx:alpine
    container_name: lead-data-web
    ports:
      - "${PORT:-3000}:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api-go:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - lead_net

  # ── Redis (live pub/sub; durable jobs live in Postgres) ─────────
  redis:
    image: redis:7-alpine
    container_name: lead-data-redis
    ports:
      # Redis has no authentication in this self-host profile; never expose it
      # to the LAN. Containers reach it through the private lead_net network.
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - lead_net

  # ── Reacher (OPTIONAL self-hosted email verification) ──────────
  # Strongest tier of the email cascade: unlimited, $0/email SMTP RCPT probing
  # (safe/risky/invalid/unknown + catch-all + disposable + role). DUAL-LICENSED
  # AGPL-3.0 OR commercial — we run the AGPL build as a separate networked
  # process (unambiguously compliant; no GPL contamination of OpenGTM's code).
  #
  # NOT started by default. Enable with:  docker compose --profile reacher up
  # Then set REACHER_ENABLED=1 (and a header secret) in .env to wire it into the
  # cascade.
  #
  # PORT-25 CAVEAT: Reacher does real outbound :25 RCPT probes. Most clouds block
  # egress on :25, so without port-25 access or a SOCKS5 proxy (RCH__PROXY__*)
  # Reacher returns mostly `unknown` and the cascade correctly falls back to the
  # bundled SMTP probe / HTTP vendors. For hosted SaaS the realistic path is the
  # commercial Reacher cloud API (set REACHER_API_KEY, leave this profile off).
  #
  # NOT published on a host port (internal lead_net only) — never expose it.
  reacher:
    image: reacherhq/backend:v0.10.0   # pinned (do NOT track `latest`)
    container_name: lead-data-reacher
    profiles: [reacher]
    environment:
      - RCH__BACKEND_NAME=yupcha-reacher
      - RCH__HTTP_HOST=0.0.0.0
      - RCH__SMTP__FROM_EMAIL=${REACHER_FROM_EMAIL:-verify@yupcha.com}
      - RCH__SMTP__HELLO_NAME=${REACHER_HELLO_NAME:-verify.yupcha.com}
      # Header secret — clients must send `Authorization: Bearer <secret>`.
      # Set REACHER_API_KEY in .env to the same value so the cascade authenticates.
      - RCH__HEADER_SECRET=${REACHER_API_KEY:-}
      # Optional SOCKS5 proxy to escape blocked port-25 egress (operator-supplied):
      # - RCH__PROXY__HOST=${REACHER_PROXY_HOST:-}
      # - RCH__PROXY__PORT=${REACHER_PROXY_PORT:-}
      # - RCH__PROXY__USERNAME=${REACHER_PROXY_USERNAME:-}
      # - RCH__PROXY__PASSWORD=${REACHER_PROXY_PASSWORD:-}
    restart: unless-stopped
    networks:
      - lead_net

  # ── Go MCP server, SSE transport (opt-in: --profile mcp) ──
  # Internal only (no host port); clients on lead_net reach http://mcp:3100. stdio use is `opengtm-mcp`
  # run directly.
  mcp:
    profiles: ["mcp"]
    build:
      context: ./apps/backend-go
      dockerfile: Dockerfile
      target: mcp
    image: opengtm-mcp-go:local
    command: ["--sse", "3100"]
    env_file:
      - path: .env
        required: false
    environment:
      <<: *go-env
      OPENGTM_MCP_SSE_HOST: 0.0.0.0
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - lead_net
      - browser_net

  # ── Benchmark-only provider simulator (docker compose --profile bench) ──
  providersim:
    profiles: ["bench"]
    build:
      context: ./apps/backend-go
      dockerfile: Dockerfile.providersim
    environment:
      - SIM_ADDR=:8099
      - SIM_PROFILE=${SIM_PROFILE:-ok}
      - SIM_SEED=${SIM_SEED:-1}
      - SIM_NOMATCH_EVERY=${SIM_NOMATCH_EVERY:-0}
    restart: "no"
    networks:
      - lead_net

volumes:
  pgdata:
  redisdata:

networks:
  # Go services <-> browser service only; internal = no route to the outside.
  browser_net:
    internal: true
  # The browser service's own way out (nothing else attaches to it).
  browser_egress:
    driver: bridge
  lead_net:
    driver: bridge
    ipam:
      config:
        - subnet: ${LEAD_NET_SUBNET:-172.29.250.0/24}
