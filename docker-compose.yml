

services:
  # ── API (FastAPI backend) ──────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lead-data-api
    env_file: .env
    environment:
      - DB_PATH=/app/data/data.db
      - PYTHONPATH=/app
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./data:/app/data  # SQLite persistence
      - frontend_dist:/app/apps/web/dist  # Share built frontend with nginx
    ports:
      - "8000:8000"       # Direct API access (optional, nginx proxies this)
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - lead_net

  # ── Enrichment Worker (BullMQ) ─────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lead-data-worker
    env_file: .env
    environment:
      - DB_PATH=/app/data/data.db
      - PYTHONPATH=/app
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./data:/app/data
    command: python -m apps.api.services.workbook.worker
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - lead_net

  # ── Redis (job queue + pub/sub) ────────────────────────
  redis:
    image: redis:7-alpine
    container_name: lead-data-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - lead_net

  # ── Nginx (reverse proxy + static files) ───────────────
  nginx:
    image: nginx:alpine
    container_name: lead-data-web
    ports:
      - "${PORT:-3000}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend_dist:/usr/share/nginx/html:ro  # Serve built frontend from API build
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - lead_net

volumes:
  redisdata:
  frontend_dist:

networks:
  lead_net:
    driver: bridge
