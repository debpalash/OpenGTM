<!doctype html>
<html>
<head>
    <meta charset="utf-8" />
    <title>OpenGTM Capture — Options</title>
    <style>
        body { font: 14px/1.5 system-ui, sans-serif; margin: 0 auto; padding: 24px; max-width: 720px; color: #1a1a1a; }
        h1 { font-size: 18px; }
        label { display: block; font-weight: 600; margin: 16px 0 4px; }
        input { font: inherit; padding: 6px 8px; border: 1px solid #bbb; border-radius: 6px; width: 100%; box-sizing: border-box; }
        button { font: inherit; padding: 6px 14px; border: 1px solid #bbb; border-radius: 6px; background: #f5f5f5; cursor: pointer; margin-top: 12px; }
        button:hover { background: #e9e9e9; }
        table { border-collapse: collapse; width: 100%; margin-top: 8px; }
        td { padding: 4px 6px 4px 0; vertical-align: top; }
        td button { margin-top: 0; }
        #status { margin-top: 12px; min-height: 1.2em; }
        #status[data-kind="error"] { color: #b00020; }
        #status[data-kind="ok"] { color: #0a7a2f; }
        .hint { color: #666; font-size: 13px; margin-top: 4px; }
    </style>
</head>
<body>
    <h1>OpenGTM Capture — Options</h1>

    <label for="base-url">OpenGTM base URL</label>
    <input id="base-url" type="url" placeholder="https://opengtm.example.com" />
    <p class="hint">Saving asks Chrome for permission to talk to this origin only — the extension ships with no API host access.</p>

    <label>Workbooks</label>
    <p class="hint">Create an ingest token (wbi_…) per workbook in OpenGTM, then paste the workbook ID and token here.</p>
    <table>
        <tbody id="workbooks"></tbody>
    </table>
    <button id="add-workbook" type="button">Add workbook</button>

    <div>
        <button id="save" type="button">Save</button>
    </div>
    <div id="status" data-kind="info"></div>

    <script src="options.js" type="module"></script>
</body>
</html>
