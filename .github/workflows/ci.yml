name: PR checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'
          enable-cache: true
      - run: uv run --frozen pytest -q -m 'not live and not postgres'

  postgres:
    name: PostgreSQL integrity and tenancy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: opengtm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d opengtm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/opengtm_test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'
          enable-cache: true
      - run: >-
          uv run --frozen pytest -q
          tests/test_create_merge_pg.py
          tests/test_entity_identity_pg.py
          tests/test_pg_tenancy_rls.py
          tests/test_lead_paging_pg.py
          tests/test_workbook_refresh_stale_sql_pg.py

  frontend:
    name: Frontend lint, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun test apps/web/tests
      - run: bun test packages/chrome-extension
      - run: bun run build

  frontend-browser:
    name: Frontend browser regressions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'
          enable-cache: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - run: uv run --frozen playwright install --with-deps chromium
      - name: Run mounted React interaction regressions
        shell: bash
        run: |
          export OPENGTM_BUN="$(command -v bun)"
          export OPENGTM_CHROMIUM="$(uv run --frozen python -c 'from playwright.sync_api import sync_playwright; p = sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          uv run --frozen pytest -q \
            tests/test_workbook_socket_browser.py \
            tests/test_lead_selection_browser.py \
            tests/test_workbook_clipboard_browser.py

  go:
    name: Go backend (vet, sqlc, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: opengtm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d opengtm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/opengtm_test
    defaults:
      run:
        working-directory: apps/backend-go
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/backend-go/go.mod
          cache-dependency-path: apps/backend-go/go.sum
      # Alembic lives in the Python backend, so CI checks the committed schema.sql
      # (regenerated locally via scripts/go_schema_dump.sh) rather than regenerating it.
      - name: Apply committed schema
        run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -q -f internal/db/schema.sql
      - run: go tool sqlc diff
      - run: go vet ./...
      - run: go test -race ./...
      - run: go test -race -tags integration ./...
