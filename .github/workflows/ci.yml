name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --dev
      - name: Hermetic backend suite
        env:
          APP_ENV: test
          DATABASE_URL: sqlite:///./data/_ci_tests.db
          YUPCHA_DB_INIT: alembic
        run: uv run pytest -q
      - name: Fresh schema and model drift check
        env:
          APP_ENV: test
          DATABASE_URL: sqlite:///./data/_ci_schema.db
        run: |
          uv run alembic upgrade head
          uv run alembic check

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1"
      # Exercise every shipped TypeScript package: web, Chrome capture, and
      # the n8n community node. Root scripts fan out through Turborepo.
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run build

  compose-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # Validate the same documented first-run path operators use. Compose
      # intentionally loads .env for every application service, while secrets
      # and provider keys remain optional in the checked-in example.
      - run: cp .env.example .env
      - run: docker compose config --quiet
