name: CLA reminders

on:
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write
  statuses: read

jobs:
  reminders:
    runs-on: ubuntu-24.04
    concurrency:
      group: cla-reminders
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - run: python3 .github/scripts/cla_reminders.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
