name: Docs site

# Deploys apps/docs to Cloudflare Workers at https://opengtm.palash.dev.
#
# Deliberately manual: the site is deployed only when a maintainer triggers
# this workflow. To deploy automatically on every change to the docs, add
#   push:
#     branches: [main]
#     paths: ["apps/docs/**", "scripts/export_openapi.py"]
# to `on:`. Requires the CLOUDFLARE_API_TOKEN (Workers Scripts:Edit +
# Workers Routes:Edit + Zone:Read on palash.dev) and CLOUDFLARE_ACCOUNT_ID
# repository secrets.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "wrangler environment (blank = production)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1"
      - name: Install
        working-directory: apps/docs
        run: bun install --frozen-lockfile
      - name: Build
        working-directory: apps/docs
        run: bun --bun run build  # bun runtime: avoids astro's node version floor on the runner
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/docs
          command: deploy ${{ inputs.environment != '' && format('--env {0}', inputs.environment) || '' }}
