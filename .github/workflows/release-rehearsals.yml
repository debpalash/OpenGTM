name: Release rehearsals

# Fresh-install rehearsal, backup/restore drill and v3.0.0 upgrade rehearsal (scripts/release,
# docs/operations/release-rehearsals.md). Separate from ci.yml on purpose: building every image (Go services and
# the Chromium browser service) and running three full stacks takes well over the ~5 minutes a pull request
# should wait.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-rehearsals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rehearsals:
    name: Install, backup/restore and upgrade rehearsals
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Same as the browser-service job in ci.yml: Ubuntu 24.04 runners block unprivileged user namespaces
      # through AppArmor, and the browser container's Chromium sandbox needs them.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Fresh-install rehearsal
        # Builds the images once; the drill below reuses them.
        run: scripts/release/rehearse-install.sh
      - name: Backup and restore drill
        env:
          REHEARSAL_NO_BUILD: "1"
        run: scripts/release/rehearse-backup-restore.sh
      - name: Fetch the v3.0.0 tag
        # The upgrade rehearsal builds a real v3.0.0 install from `git archive v3.0.0`.
        run: git fetch --depth=1 origin tag v3.0.0
      - name: Upgrade rehearsal (v3.0.0 to the Go runtime)
        env:
          REHEARSAL_NO_BUILD: "1"
        run: scripts/release/rehearse-upgrade.sh
