[project]
name = "browser-service"
version = "0.1.0"
description = "Internal browser/anti-bot service for OpenGTM (Playwright, scrapers). Called only by the Go backend."
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "curl-cffi>=0.17.0",
    "ddgs>=9.16.1",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "markdownify>=1.2.3",
    "playwright>=1.64.1",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.10.7,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["browser: needs an installed Chromium (playwright install chromium)"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B011", "ASYNC"]
