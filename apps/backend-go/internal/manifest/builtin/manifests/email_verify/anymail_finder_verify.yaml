# Anymail Finder "Verify Email" -- declarative provider manifest.
# Docs: https://anymailfinder.com/email-finder-api/docs/verify-email
# Spec: https://api.anymailfinder.com/openapi.json (POST /v5.1/verify-email).
# Auth: raw API key in the Authorization header (no "Bearer" prefix).
# email_status is one of valid, risky, invalid, the same words the native
# verifiers write to email_verify. The credit price depends on the plan, so
# cost_per_lookup is 0 (unknown).
manifest_version: "1"
name: anymail_finder_verify
display_name: Anymail Finder Email Verifier
author: OpenGTM
homepage: https://anymailfinder.com/email-finder-api/docs/verify-email
tags: [email, verification, byok]
capability: email_verify
capabilities: [email_verify]
description: Anymail Finder /v5.1/verify-email - email -> valid, risky or invalid.
default_confidence: 0.9
cost_per_lookup: 0
auth:
  type: header
  param: Authorization
  env_var: ANYMAIL_FINDER_API_KEY
request:
  method: POST
  url: https://api.anymailfinder.com/v5.1/verify-email
  headers:
    Content-Type: application/json
  body:
    email: "{{input.email}}"
  timeout: 60
response:
  mappings:
    email_verify: "$.email_status"
