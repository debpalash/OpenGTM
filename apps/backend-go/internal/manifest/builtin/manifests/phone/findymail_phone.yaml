# Findymail "Find phone" -- declarative provider manifest.
# Docs: https://app.findymail.com/docs/ (POST /api/search/phone).
# Auth: Authorization: Bearer <key>. Synchronous.
# Limits stated in the docs: US numbers only, and no result for EU citizens.
# Billing: 10 finder credits when a phone is found, free otherwise. The credit
# price depends on the plan, so cost_per_lookup is 0 (unknown).
# Not found is HTTP 200 with {"phone": null, "line_type": null}.
manifest_version: "1"
name: findymail_phone
display_name: Findymail Phone Finder
author: OpenGTM
homepage: https://app.findymail.com/docs/
tags: [phone, enrichment, byok]
capability: phone
capabilities: [phone]
description: Findymail /api/search/phone - LinkedIn profile URL -> phone number (US only).
default_confidence: 0.7
cost_per_lookup: 0
auth:
  type: bearer
  env_var: FINDYMAIL_API_KEY
request:
  method: POST
  url: https://app.findymail.com/api/search/phone
  headers:
    Content-Type: application/json
  body:
    linkedin_url: "{{input.linkedin_url}}"
  timeout: 30
response:
  error_path: error
  error_message_path: error
  mappings:
    phone: "$.phone"
