# BetterContact "Enrich leads" (mobile phone) -- declarative provider manifest (asynchronous: submit, then poll).
# Docs: https://doc.bettercontact.rocks/api-reference/endpoint/create.md (POST /async),
# https://doc.bettercontact.rocks/api-reference/endpoint/get.md (GET /async/{request_id}),
# https://doc.bettercontact.rocks/api-reference/statuses.md. Base URL
# https://app.bettercontact.rocks/api/v2; auth is the X-API-Key header.
# Same flow as bettercontact_email (see there): submit, then poll until status "terminated"
# (HTTP 200); "on_hold" fails the lookup. The docs say to send linkedin_url whenever phone
# enrichment is requested, so a lead without one is unlikely to match.
# enrich_phone_number alone asks for the phone only (the email default applies only when no
# enrich_* flag is set). BetterContact submissions are not idempotent (a repeated POST bills
# twice), and this manifest never retries the POST.
# A result counts when the lead is marked enriched. Credits depend on the plan, so
# cost_per_lookup is 0 (unknown).
# Terms: the BetterContact terms say use is for internal business purposes. This manifest supports the key holder's own use of their own account only; it is not a way to resell or redistribute the vendor's data.
manifest_version: "1"
name: bettercontact_phone
display_name: BetterContact Phone Finder
author: OpenGTM
homepage: https://doc.bettercontact.rocks/
tags: [phone, enrichment, byok, async]
capability: phone
capabilities: [phone]
description: BetterContact /async - LinkedIn profile URL -> mobile phone (asynchronous waterfall).
default_confidence: 0.75
cost_per_lookup: 0
auth:
  type: header
  param: X-API-Key
  env_var: BETTERCONTACT_API_KEY
request:
  method: POST
  url: https://app.bettercontact.rocks/api/v2/async
  headers:
    Content-Type: application/json
  body:
    data:
      - first_name: "{{input.first_name}}"
        last_name: "{{input.last_name}}"
        company: "{{input.company}}"
        company_domain: "{{input.domain}}"
        linkedin_url: "{{input.linkedin_url}}"
    enrich_phone_number: true
  timeout: 20
poll:
  request:
    method: GET
    url: https://app.bettercontact.rocks/api/v2/async/{{response.id}}
    timeout: 20
  interval: 5
  max_attempts: 24
  max_total: 120
  done_when:
    status: [200]
    path: "$.status"
    equals: terminated
  failed_when:
    path: "$.status"
    equals: on_hold
response:
  error_path: error
  error_message_path: error
  success_when:
    path: "$.data[0].enriched"
    equals: true
  mappings:
    phone: "$.data[0].contact_phone_number"
