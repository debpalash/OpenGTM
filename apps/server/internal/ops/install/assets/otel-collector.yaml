# OpenTelemetry Collector for the OpenGTM `full` profile.
#
# It accepts OTLP on 4317 (gRPC) and 4318 (HTTP) inside the compose network and
# writes what it receives to its own log. Replace the exporter with your
# backend (Tempo, Jaeger, Grafana Cloud, ...) to keep the data.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
