<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/opengtm-mark-v8.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenGTM — Go-to-Market Agents for atomic teams</title>
    <meta name="description" content="Open-source go-to-market agents that source, enrich, research, and activate leads for atomic teams." />
    <script>
      // Apply saved theme immediately to prevent flash
      (function() {
        var t = localStorage.getItem('theme');
        if (t === 'light') { document.documentElement.classList.remove('dark'); }
        else { document.documentElement.classList.add('dark'); }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
